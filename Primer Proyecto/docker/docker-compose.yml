# Clúster de 3 nodos Apache Cassandra 4.1
# - Heap limitado a 512M por nodo para poder correr en máquinas con poca RAM.
# - NetworkTopologyStrategy/dc1 con RF=3 se aplica via DDL (ddl/01_keyspace.cql).
# - cassandra1 actúa como seed para los demás.

networks:
  aerolinea-net:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:

services:
  cassandra1:
    image: cassandra:4.1
    container_name: cassandra1
    hostname: cassandra1
    networks:
      - aerolinea-net
    ports:
      - "9042:9042"        # CQL nativo (para clientes fuera del stack)
      - "7000:7000"        # interno
      - "7199:7199"        # JMX
    environment:
      CASSANDRA_CLUSTER_NAME: "AeroCluster"
      CASSANDRA_DC: "dc1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      CASSANDRA_SEEDS: "cassandra1"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    volumes:
      - node1-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  cassandra2:
    image: cassandra:4.1
    container_name: cassandra2
    hostname: cassandra2
    networks:
      - aerolinea-net
    ports:
      - "9142:9042"        # CQL nativo del NODO 2 en host
    environment:
      CASSANDRA_CLUSTER_NAME: "AeroCluster"
      CASSANDRA_DC: "dc1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      CASSANDRA_SEEDS: "cassandra1"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    volumes:
      - node2-data:/var/lib/cassandra
    depends_on:
      cassandra1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  cassandra3:
    image: cassandra:4.1
    container_name: cassandra3
    hostname: cassandra3
    networks:
      - aerolinea-net
    ports:
      - "9242:9042"        # CQL nativo del NODO 3 en host
    environment:
      CASSANDRA_CLUSTER_NAME: "AeroCluster"
      CASSANDRA_DC: "dc1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      CASSANDRA_SEEDS: "cassandra1"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    volumes:
      - node3-data:/var/lib/cassandra
    depends_on:
      cassandra1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s