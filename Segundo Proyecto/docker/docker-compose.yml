# Neo4j para Proyecto 2 - Sistema de Recomendacion de Restaurantes
services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/admin123"  # Usuario y contrasena (minimo 8 caracteres)
      NEO4J_PLUGINS: '["apoc"]'  # APOC requerido por el MCP de Neo4j
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_server_memory_heap_initial__size: "512m"  # Heap inicial de la JVM
      NEO4J_server_memory_heap_max__size: "2G"  # Heap maximo de la JVM
      NEO4J_server_memory_pagecache_size: "1G"  # Cache de paginas del grafo
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"  # Permite LOAD CSV
      NEO4J_server_directories_import: "/import"  # Carpeta de importacion para LOAD CSV
    volumes:
      - neo4j_data:/data
      - ../data:/import:ro  # CSVs de la Fase 4 montados solo lectura
    restart: unless-stopped
volumes:
  neo4j_data:
